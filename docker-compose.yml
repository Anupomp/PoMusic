services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://pomusic:${POSTGRES_PASSWORD:-pomusic}@db:5432/pomusic
      REDIS_URL: redis://cache:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pomusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomusic}
      POSTGRES_DB: pomusic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomusic"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
